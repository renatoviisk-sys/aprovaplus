<script>
/* =====================================================================
   APROVA+ · App de estudos para concursos
   Arquitetura: SPA vanilla JS · persistência em LocalStorage
   Módulos: Dados · Biblioteca · Leitor · IA · Revisão (SM-2) · Dashboard
   ===================================================================== */

'use strict';

/* ============================ 1. DADOS ============================ */
const DB_KEY = 'aprovaplus_db_v1';

const defaultDB = () => ({
  materias: [],            // {id, nome, topicos:[{id, nome}]}
  texts: [],               // {id, materiaId, topicoId, titulo, kind:'texto'|'lei', html, drawing, createdAt}
  cards: [],               // {id, materiaId, topicoId, front, back, ef, intervalo, reps, due}
  questoes: [],            // banco de questões (IA + importadas) {…, origem, lastResult}
  errors: [],              // caderno de erros COM SRS: {…, ef, intervalo, reps, due}
  answers: [],             // {materiaId, topicoId, correct, ts}
  resumos: [],             // {id, textId, tipo:'resumo'|'mapa'|'esquema', md, createdAt}
  sessions: [],            // sessões de estudo: {materiaId, min, ts}
  simulados: [],           // histórico: {id, ts, total, acertos, tempoMin, n}
  discursivas: [],         // {id, materiaId, banca, tipo, tema, resposta, correcao, ts}
  dailyLog: { date: '', novos: 0 },          // controle do limite diário de cards novos
  bancaStats: {},          // {banca: {min, q}} — ritmo médio por banca (simulados)
  edital: { horasSemana: 20, pesos: {}, dataProva: '' },   // pesos: {materiaId: 1..5}
  settings: { apiKey: '', model: 'claude-sonnet-4-5', theme: 'light', fontSize: 19,
              foco: 25, pausa: 5, autoBackup: true, lastBackup: 0,
              maxNovos: 20, maxRev: 100, metaDiaria: 120 }
});

let db = defaultDB();   // substituído no boot() pelo conteúdo do IndexedDB

/* migração de dados de versões anteriores */
function migrate(d) {
  d.texts.forEach(t => {
    if (!t.kind) t.kind = 'texto';
    if (t.leituras === undefined) { t.leituras = 0; t.proxLeitura = null; }
  });
  d.errors.forEach(e => {
    if (e.ef === undefined) { e.ef = 2.5; e.intervalo = 1; e.reps = 0; e.due = Date.now(); }
  });
  d.questoes.forEach(q => { if (!q.origem) q.origem = 'ia'; });
  d.cards.forEach(c => { if (!c.tipo) c.tipo = (c.front || '').includes('______') ? 'cloze' : 'basico'; });
  return d;
}
function mergeDB(parsed) {
  const d = Object.assign(defaultDB(), parsed);
  d.settings = Object.assign(defaultDB().settings, parsed.settings || {});
  d.edital = Object.assign(defaultDB().edital, parsed.edital || {});
  d.dailyLog = Object.assign(defaultDB().dailyLog, parsed.dailyLog || {});
  return migrate(d);
}

/* ---------- IndexedDB: centenas de MB, com confirmação de gravação ----------
   LocalStorage (limite ~5MB no Safari) fica apenas como fallback de emergência
   e como fonte de migração de dados antigos. --------------------------------- */
const IDB_NAME = 'aprovaplus', IDB_STORE = 'kv';
function idbOpen() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(IDB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(IDB_STORE);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbGet(k) {
  const d = await idbOpen();
  return new Promise((res, rej) => {
    const t = d.transaction(IDB_STORE, 'readonly').objectStore(IDB_STORE).get(k);
    t.onsuccess = () => res(t.result);
    t.onerror = () => rej(t.error);
  });
}
async function idbSet(k, v) {
  const d = await idbOpen();
  return new Promise((res, rej) => {
    const tx = d.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(v, k);
    tx.oncomplete = () => res(true);     // gravação CONFIRMADA pela transação
    tx.onerror = () => rej(tx.error);
    tx.onabort = () => rej(tx.error);
  });
}

let _saveTimer = null, lastSaveOk = true;
function save() {                         // debounce: agrupa gravações em 300ms
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(flushSave, 300);
}
async function flushSave() {
  clearTimeout(_saveTimer);
  const json = JSON.stringify(db);
  try {
    await idbSet('db', json);
    lastSaveOk = true;
  } catch (e) {
    lastSaveOk = false;
    try { localStorage.setItem(DB_KEY, json); } catch (e2) { /* sem espaço no fallback */ }
    toast('⚠️ Falha ao salvar no banco — exporte um backup AGORA (Ajustes)', 5000);
  }
}
async function loadDB() {
  try {
    const raw = await idbGet('db');
    if (raw) return mergeDB(JSON.parse(raw));
  } catch (e) { /* IDB indisponível: cai no legado */ }
  try {
    const leg = localStorage.getItem(DB_KEY);  // migração de quem usava LocalStorage
    if (leg) return mergeDB(JSON.parse(leg));
  } catch (e) {}
  return defaultDB();
}
// grava imediatamente quando o app vai para segundo plano (iPad: trocar de app)
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { if (currentView === 'leitor') saveReaderHTML(); flushSave(); }
});
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* ---------- helpers ---------- */
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const materiaById = id => db.materias.find(m => m.id === id);
const topicoNome = (mId, tId) => (materiaById(mId)?.topicos.find(t => t.id === tId)?.nome) || '';
const fmtDate = ts => new Date(ts).toLocaleDateString('pt-BR');

function toast(msg, ms = 2200) {
  const t = $('#toast'); t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.add('hidden'), ms);
}

/* ---------- modal ---------- */
function openModal(html) {
  $('#modalBox').innerHTML = html;
  $('#modal').classList.remove('hidden');
  $('#modal').classList.add('flex');
  lucide.createIcons();
}
function closeModal() {
  $('#modal').classList.add('hidden');
  $('#modal').classList.remove('flex');
}
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

/* ============================ 2. NAVEGAÇÃO ============================ */
const VIEWS = [
  { id: 'dashboard',  icon: 'layout-dashboard', label: 'Painel' },
  { id: 'biblioteca', icon: 'library',          label: 'Biblioteca' },
  { id: 'ciclo',      icon: 'calendar-range',   label: 'Ciclo' },
  { id: 'revisao',    icon: 'layers',           label: 'Revisão' },
  { id: 'questoes',   icon: 'list-checks',      label: 'Questões' },
  { id: 'simulados',  icon: 'timer',            label: 'Simulados' },
  { id: 'discursiva', icon: 'pen-line',         label: 'Discursiva' },
  { id: 'erros',      icon: 'x-circle',         label: 'Erros' },
  { id: 'config',     icon: 'settings',         label: 'Ajustes' },
];
let currentView = 'dashboard';

function renderNav() {
  const mk = v => `
    <button onclick="showView('${v.id}')" data-v="${v.id}"
      class="nav-btn flex items-center gap-3 px-3 py-2.5 rounded-xl text-ink-500 dark:text-ink-300 hover:bg-ink-100 dark:hover:bg-ink-800 transition ${currentView===v.id?'active':''}">
      <i data-lucide="${v.icon}" class="w-5 h-5"></i><span>${v.label}</span>
    </button>`;
  $('#sideNav').innerHTML = VIEWS.map(mk).join('');
  $('#bottomNav').innerHTML = VIEWS.map(v => `
    <button onclick="showView('${v.id}')" data-v="${v.id}"
      class="nav-btn flex flex-col items-center gap-0.5 px-1.5 py-1 rounded-xl text-[9px] text-ink-400 dark:text-ink-400 ${currentView===v.id?'active':''}">
      <i data-lucide="${v.icon}" class="w-[18px] h-[18px]"></i>${v.label}
    </button>`).join('');
  lucide.createIcons();
}

function showView(id) {
  currentView = id;
  $$('.view').forEach(v => v.classList.remove('active'));
  $('#view-' + id).classList.add('active');
  renderNav();
  const renderers = { dashboard: renderDashboard, biblioteca: renderBiblioteca, ciclo: renderCiclo, revisao: renderRevisao, questoes: renderQuestoes, simulados: renderSimulados, discursiva: renderDiscursiva, erros: renderErros, config: renderConfig };
  if (renderers[id]) renderers[id]();
}

/* ---------- tema ---------- */
function applyTheme() {
  document.documentElement.classList.toggle('dark', db.settings.theme === 'dark');
}
$('#themeBtn').addEventListener('click', () => {
  db.settings.theme = db.settings.theme === 'dark' ? 'light' : 'dark';
  save(); applyTheme();
});

/* ============================ 3. DASHBOARD ============================ */
function statsPorMateria() {
  const map = {};
  db.answers.forEach(a => {
    if (!map[a.materiaId]) map[a.materiaId] = { total: 0, certas: 0 };
    map[a.materiaId].total++; if (a.correct) map[a.materiaId].certas++;
  });
  return map;
}

function renderDashboard() {
  const total = db.answers.length;
  const certas = db.answers.filter(a => a.correct).length;
  const taxa = total ? Math.round(certas / total * 100) : 0;
  const due = cardsDue('all').length + errosDue().length;
  const minSemana = Object.values(horasEstudadasSemana()).reduce((a, b) => a + b, 0);
  const rec = recomendacao();
  const porMat = statsPorMateria();
  const fracos = topicosFracos();

  const kpi = (icon, val, label, cls) => `
    <div class="bg-white dark:bg-ink-900 rounded-2xl p-5 border border-ink-100 dark:border-ink-800">
      <div class="flex items-center gap-2 text-ink-400 text-xs mb-2"><i data-lucide="${icon}" class="w-4 h-4"></i>${label}</div>
      <div class="text-3xl font-semibold ${cls||''}">${val}</div>
    </div>`;

  const barras = db.materias.map(m => {
    const s = porMat[m.id] || { total: 0, certas: 0 };
    const pct = s.total ? Math.round(s.certas / s.total * 100) : 0;
    return `
      <div class="mb-4">
        <div class="flex justify-between text-sm mb-1.5">
          <span class="font-medium">${esc(m.nome)}</span>
          <span class="text-ink-400">${s.certas}/${s.total} · ${pct}%</span>
        </div>
        <div class="h-2.5 rounded-full bg-ink-100 dark:bg-ink-800 overflow-hidden">
          <div class="h-full rounded-full bg-accent-400" style="width:${pct}%"></div>
        </div>
      </div>`;
  }).join('') || `<p class="text-sm text-ink-400">Responda questões para ver estatísticas por matéria.</p>`;

  const st = streak();
  const minHoje = db.sessions.filter(s => new Date(s.ts).toDateString() === new Date().toDateString()).reduce((a, b) => a + b.min, 0);
  const metaPct = Math.min(100, Math.round(minHoje / (db.settings.metaDiaria || 120) * 100));
  const diasProva = db.edital.dataProva ? Math.ceil((new Date(db.edital.dataProva + 'T23:59:59') - Date.now()) / 864e5) : null;
  const cob = cobertura();

  $('#view-dashboard').innerHTML = `

/* extração de texto do PDF via PDF.js */
async function extractPDF(input) {
  const file = input.files[0]; if (!file) return;
  const st = $('#pdfStatus');
  try {
    st.textContent = 'Lendo PDF…';
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    let out = '';
    for (let p = 1; p <= pdf.numPages; p++) {
      st.textContent = `Extraindo página ${p}/${pdf.numPages}…`;
      const page = await pdf.getPage(p);
      const tc = await page.getTextContent();
      let lastY = null, pageTxt = '';
      tc.items.forEach(it => {
        const y = it.transform[5];
        if (lastY !== null && Math.abs(y - lastY) > 14) pageTxt += '\n\n';
        else if (lastY !== null && Math.abs(y - lastY) > 2) pageTxt += '\n';
        pageTxt += it.str;
        lastY = y;
      });
      out += pageTxt + '\n\n';
    }
    $('#ntTexto').value = out.replace(/\n{3,}/g, '\n\n').trim();
    if (!$('#ntTitulo').value) $('#ntTitulo').value = file.name.replace(/\.pdf$/i, '');
    st.textContent = `✓ ${pdf.numPages} página(s) extraída(s). Revise o texto acima.`;
  } catch (e) {
    st.textContent = 'Erro ao ler o PDF: ' + e.message;
  }
}

/* converte texto bruto em HTML de parágrafos */
function textoParaHTML(txt) {
  return txt.split(/\n{2,}/).map(p => `<p>${esc(p.trim()).replace(/\n/g, '<br>')}</p>`).filter(p => p !== '<p></p>').join('');
}
function addTexto() {
  const titulo = $('#ntTitulo').value.trim();
  const txt = $('#ntTexto').value.trim();
  if (!titulo || !txt) { toast('Preencha título e conteúdo'); return; }
  const kind = document.querySelector('input[name="ntKind"]:checked')?.value || 'texto';
  db.texts.push({
    id: uid(), materiaId: $('#ntMat').value, topicoId: $('#ntTop').value || null,
    titulo, kind, html: kind === 'lei' ? leiParaHTML(txt) : textoParaHTML(txt),
    drawing: null, createdAt: Date.now()
  });
  save(); closeModal(); renderBiblioteca(); toast(kind === 'lei' ? 'Lei seca estruturada ✓' : 'Material salvo ✓');
}
function delText(id) {
  if (!confirm('Excluir este texto? (grifos e anotações serão perdidos)')) return;
  db.texts = db.texts.filter(t => t.id !== id);
  save(); renderBiblioteca();

        <span class="text-[10px] text-ink-400 ml-auto hidden sm:inline">⚡ em cada artigo gera flashcards dele</span>
      </div>` : ''}

      <!-- área de leitura -->

          <canvas id="penCanvas" style="pointer-events:none"></canvas>

  $$('.view').forEach(v => v.classList.remove('active'));

  requestAnimationFrame(() => { setupCanvas(); loadDrawing(); });

  // lei seca: popula navegação por artigo (ordenada NUMERICAMENTE: 1, 2, 3… e sufixos -A, -B)

    const arts = $$('#readerContent .lei-art');
    const nav = $('#artNav');
    if (nav) {
      const vistos = new Set();
      const itens = arts.map((a, i) => {
        const label = (a.querySelector('.art-num')?.textContent || 'Art. ' + (i + 1)).trim();
        const m = label.match(/(\d+)(?:\s*-\s*([A-Z]))?/i);
        return { i, label, n: m ? +m[1] : 1e9, suf: (m && m[2]) ? m[2].toUpperCase().charCodeAt(0) : 0 };
      })
      // remove duplicatas (citações de artigos no meio do texto que o parser pegou): mantém a 1ª ocorrência
      .filter(x => { const k = x.n + '-' + x.suf; if (vistos.has(k)) return false; vistos.add(k); return true; })
      .sort((a, b) => a.n - b.n || a.suf - b.suf);
      nav.innerHTML = '<option value="">Ir para artigo…</option>' +

/* ---------- canvas de desenho (Apple Pencil) ---------- */
let ctx = null, drawing = false, saveDrawTimer = null;

function setupCanvas() {
  const canvas = $('#penCanvas'), wrap = $('#readerWrap');
  if (!canvas || !wrap) return;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = wrap.clientWidth * dpr;
  canvas.height = wrap.scrollHeight * dpr;
  canvas.style.width = wrap.clientWidth + 'px';
  canvas.style.height = wrap.scrollHeight + 'px';
  ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';

  canvas.addEventListener('pointerdown', e => {
    if (!penMode) return;
    drawing = true;
    canvas.setPointerCapture(e.pointerId);
    ctx.beginPath();
    const r = canvas.getBoundingClientRect();
    ctx.moveTo(e.clientX - r.left, e.clientY - r.top);
    e.preventDefault();
  });
  canvas.addEventListener('pointermove', e => {
    if (!drawing || !penMode) return;
    const r = canvas.getBoundingClientRect();
    const pressure = (e.pointerType === 'pen' && e.pressure) ? e.pressure : 0.5;
    if (penEraser) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 22; }
    else { ctx.globalCompositeOperation = 'source-over'; ctx.strokeStyle = penColor; ctx.lineWidth = 1 + pressure * 3.2; }
    ctx.lineTo(e.clientX - r.left, e.clientY - r.top);
    ctx.stroke();
    e.preventDefault();
  });
  const end = () => { if (drawing) { drawing = false; scheduleSaveDrawing(); } };
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', end);
}
function resizeCanvasKeep() {
  // redimensiona preservando o desenho atual
  const data = $('#penCanvas')?.toDataURL();
  setupCanvas();
  if (data) drawFromDataURL(data);
}
function scheduleSaveDrawing() {
  clearTimeout(saveDrawTimer);
  saveDrawTimer = setTimeout(() => {
    const t = db.texts.find(x => x.id === readerTextId);
    if (t) { t.drawing = $('#penCanvas').toDataURL('image/png'); save(); }
  }, 600);
}
function loadDrawing() {
  const t = db.texts.find(x => x.id === readerTextId);
  if (t?.drawing) drawFromDataURL(t.drawing);
}
function drawFromDataURL(url) {
  const img = new Image();
  img.onload = () => {
    const canvas = $('#penCanvas');
    ctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(img, 0, 0, canvas.width / (window.devicePixelRatio || 1), canvas.height / (window.devicePixelRatio || 1));
  };
  img.src = url;
}
function clearCanvas() {
  if (!confirm('Apagar todas as anotações de caneta deste texto?')) return;
  const canvas = $('#penCanvas');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const t = db.texts.find(x => x.id === readerTextId);
  if (t) { t.drawing = null; save(); }
}

const hlToolbar = $('#hlToolbar');

document.addEventListener('selectionchange', () => {
  if (currentView !== 'leitor' || penMode) return;
  const sel = getSelection();
  if (sel.isCollapsed || !$('#readerContent')?.contains(sel.anchorNode)) { hideHlToolbar(); return; }
  lastSelection = sel.toString().trim();
  const rect = sel.getRangeAt(0).getBoundingClientRect();
  hlToolbar.style.display = 'flex';
  const tw = hlToolbar.offsetWidth || 280;
  hlToolbar.style.left = Math.max(8, Math.min(window.innerWidth - tw - 8, rect.left + rect.width / 2 - tw / 2)) + 'px';
  hlToolbar.style.top = (rect.top + window.scrollY - 52 > 60 ? rect.top + window.scrollY - 52 : rect.bottom + window.scrollY + 10) + 'px';
});
function hideHlToolbar() { hlToolbar.style.display = 'none'; }

hlToolbar.addEventListener('pointerdown', e => e.preventDefault()); // não perder a seleção

$$('#hlToolbar [data-hl]').forEach(btn => btn.addEventListener('click', () => {
  const action = btn.dataset.hl;
  if (action === 'remove') removeHighlight(); else applyHighlight(action);
}));

function applyHighlight(cls) {
  const sel = getSelection();
  if (sel.isCollapsed) return;
  const range = sel.getRangeAt(0);
  const span = document.createElement('span');
  span.className = cls;
  try { range.surroundContents(span); }
  catch (e) { // seleção cruza elementos: extrai e envolve
    span.appendChild(range.extractContents());
    range.insertNode(span);
  }
  sel.removeAllRanges(); hideHlToolbar(); saveReaderHTML();
}
function removeHighlight() {
  const sel = getSelection();
  if (sel.isCollapsed) return;
  const range = sel.getRangeAt(0);
  $$('#readerContent .hl-y, #readerContent .hl-g, #readerContent .hl-p').forEach(s => {
    if (range.intersectsNode(s)) {
      const parent = s.parentNode;
      while (s.firstChild) parent.insertBefore(s.firstChild, s);
      parent.removeChild(s); parent.normalize();
    }
  });
  sel.removeAllRanges(); hideHlToolbar(); saveReaderHTML();
}

/* ============================ 6. IA (ANTHROPIC) ============================
   Prompts embutidos com engenharia de prompt para:
   · Flashcards no padrão Anki (atômicos, resposta única, contextualizados)
   · Questões inéditas com engenharia reversa do estilo da banca
   ========================================================================== */

async function callClaude(prompt, maxTokens = 4096) {
  if (!db.settings.apiKey) throw new Error('Configure sua chave de API em Ajustes.');
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'content-type': 'application/json',
      'x-api-key': db.settings.apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: db.settings.model,
      max_tokens: maxTokens,
      messages: [{ role: 'user', content: prompt }]
    })
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err?.error?.message || `Erro HTTP ${res.status}`);
  }
  const data = await res.json();
  return data.content.map(c => c.text || '').join('');
}

/* extrai o primeiro bloco JSON válido da resposta da IA */
function extractJSON(text) {
  const fenced = text.match(/```(?:json)?\s*([\s\S]*?)```/);
  if (fenced) text = fenced[1];
  const start = Math.min(...['[', '{'].map(c => { const i = text.indexOf(c); return i === -1 ? Infinity : i; }));
  if (start === Infinity) throw new Error('A IA não retornou JSON válido.');
  const open = text[start], close = open === '[' ? ']' : '}';
  let depth = 0;
  for (let i = start; i < text.length; i++) {
    if (text[i] === open) depth++;
    if (text[i] === close) depth--;
    if (depth === 0) return JSON.parse(text.slice(start, i + 1));
  }
  throw new Error('JSON incompleto na resposta da IA.');
}

/* contexto da matéria/tópico do texto aberto */

/* ---------- PROMPT: flashcards padrão Anki ---------- */
function promptFlashcards(materia, topico, trecho, qtd, fmt = 'misto') {
  const regraFmt = {
    basico: 'FORMATO: todos os cards do tipo pergunta→resposta.',
    cloze: 'FORMATO: TODOS os cards devem ser de LACUNA (cloze): a frente reproduz o dispositivo/trecho com o(s) termo(s)-chave substituído(s) por "______"; o verso contém APENAS o(s) termo(s) ocultado(s). Oculte exatamente o que a banca troca: verbos de comando ("será"/"poderá"), prazos, percentuais, competências, e palavras como "salvo", "vedado", "independe". Ideal para literalidade de lei seca.',
    misto: 'FORMATO: misture ~metade pergunta→resposta e ~metade cards de LACUNA (frente com "______" no termo-chave; verso apenas com o termo ocultado).'
  }[fmt];
  return `Você é um especialista em ciência da aprendizagem e no método Anki, criando flashcards para um concurseiro de alto rendimento.

MATÉRIA: ${materia}
TÓPICO: ${topico || 'geral'}

${regraFmt}

REGRAS OBRIGATÓRIAS (princípios de Wozniak/SuperMemo):
1. ATOMICIDADE: cada card testa UM único fato, conceito ou distinção. Nunca combine dois fatos.
2. RESPOSTA ÚNICA E CURTA: a frente deve admitir UMA resposta correta inequívoca; o verso deve ser o mais curto possível (ideal: 1 a 7 palavras ou uma frase curta).
3. CONTEXTUALIZAÇÃO: inicie a frente com o contexto entre colchetes, ex: "[${materia}${topico ? ' – ' + topico : ''}] ...", para evitar interferência entre matérias.
4. FORMULAÇÃO ATIVA: prefira perguntas diretas ("O que...", "Qual prazo...", "Quem é competente para...") ou lacunas ("... é o atributo que permite ___").
5. SEM AMBIGUIDADE: evite "cite características" ou listas longas; se o trecho tiver uma lista importante, quebre em vários cards (um por item ou use a técnica de quantidade + item saliente).
6. FIDELIDADE: use APENAS informações presentes no trecho. Não invente.
7. PEGADINHAS DE PROVA: priorize exatamente o que bancas cobram: prazos, competências, exceções, palavras-chave ("salvo", "vedado", "independe"), distinções entre institutos parecidos.

TRECHO DE ESTUDO:
"""
${trecho}
"""

Crie ${qtd} flashcards seguindo TODAS as regras.

Responda APENAS com JSON válido, sem texto adicional, neste formato:
[{"front":"...","back":"..."}]`;
}

/* ---------- PROMPT: questão inédita estilo banca ---------- */

- Formato: itens para julgamento CERTO ou ERRADO, precedidos de um pequeno texto-comando situacional ou direto.

- Linguagem: impessoal, técnica, períodos médios. Itens errados devem parecer plausíveis.

TRECHO DE ESTUDO:

Responda APENAS com JSON válido, sem texto adicional, neste formato:

/* ============================ 7. REVISÃO ESPAÇADA (SM-2) ============================
   Notas: Errei(0) → volta na sessão · Difícil(3) · Bom(4) · Fácil(5)
   ef = max(1.3, ef + (0.1 - (5-q)*(0.08+(5-q)*0.02)))
   intervalos: 1ª rev = 1 dia · 2ª = 6 dias · depois intervalo × ef
   ==================================================================================== */
let fila = [];        // fila da sessão atual
let cardAtual = null;
let revFiltro = 'all';

function cardsDue(filtro) {
  return db.cards.filter(c => c.due <= Date.now() && (filtro === 'all' || c.materiaId === filtro));
}

function renderRevisao() {

  } else if (!due.length) {

  } else {

        <p class="text-[11px] text-ink-300 dark:text-ink-500 mb-5">limites diários: ${db.settings.maxNovos} novos · ${db.settings.maxRev} revisões (Ajustes) · hoje já graduou ${dailyLog().novos} novo(s)</p>
        ${naFila ? `<button onclick="iniciarSessao()" class="px-8 py-3.5 rounded-2xl bg-accent-500 hover:bg-accent-600 text-white font-medium">Iniciar sessão</button>`
                 : `<p class="text-sm text-sage-500">Limite diário cumprido — os demais ficam para amanhã 💤</p>`}
      </div>`;
  }
  // releituras agendadas vencidas (revisão espaçada da LEITURA: 1/7/30/60/120 dias)
  const relDue = db.texts.filter(t => t.proxLeitura && t.proxLeitura <= Date.now() && (revFiltro === 'all' || t.materiaId === revFiltro));
  if (relDue.length) {

/* limite diário: revisões primeiro (ordenadas pelo vencimento), depois cards novos até o cap */
function dailyLog() {
  const hoje = new Date().toDateString();
  if (db.dailyLog.date !== hoje) db.dailyLog = { date: hoje, novos: 0 };
  return db.dailyLog;
}
function montarFila() {
  const due = cardsDue(revFiltro);
  const rev = due.filter(c => c.reps > 0).sort((a, b) => a.due - b.due).slice(0, db.settings.maxRev);
  const restantes = Math.max(0, db.settings.maxNovos - dailyLog().novos);
  const novos = due.filter(c => c.reps === 0).slice(0, restantes);
  return { rev, novos };
}
function iniciarSessao() {
  const { rev, novos } = montarFila();
  fila = [...rev.sort(() => Math.random() - .5), ...novos];
  if (!fila.length) { toast('Limite diário atingido — descanse 💤'); renderRevisao(); return; }
  proximoCard();
}
function proximoCard() {
  if (!fila.length) {
    $('#revArea').innerHTML = `<div class="text-center py-16"><div class="text-4xl mb-3">✅</div><p class="font-medium">Sessão concluída!</p><button onclick="renderRevisao()" class="mt-4 px-5 py-2.5 rounded-xl border border-ink-200 dark:border-ink-700 text-sm">Voltar</button></div>`;
    return;
  }
  cardAtual = fila.shift();
  $('#revArea').innerHTML = `
    <p class="text-xs text-ink-400 text-center mb-3">${fila.length + 1} restante(s) · ${esc(materiaById(cardAtual.materiaId)?.nome || '')}</p>
    <div class="flip-card" id="flipCard" onclick="virarCard()">
      <div class="flip-inner min-h-[260px]">
        <div class="flip-face bg-white dark:bg-ink-900 border border-ink-100 dark:border-ink-800 rounded-3xl p-8 min-h-[260px] flex items-center justify-center text-center cursor-pointer shadow-sm">
          <div><div class="text-lg font-medium leading-relaxed">${esc(cardAtual.front)}</div><div class="text-xs text-ink-300 dark:text-ink-500 mt-6">toque para ver a resposta</div></div>
        </div>
        <div class="flip-back flip-face bg-accent-100 dark:bg-ink-800 border border-accent-200 dark:border-ink-700 rounded-3xl p-8 min-h-[260px] flex items-center justify-center text-center cursor-pointer">
          <div class="text-lg leading-relaxed">${esc(cardAtual.back)}</div>
        </div>
      </div>
    </div>
    <div id="gradeBtns" class="hidden grid-cols-4 gap-2 mt-5">
      <button onclick="pontuar(0)" class="py-3.5 rounded-2xl bg-blush-100 dark:bg-ink-800 text-blush-500 font-medium text-sm">Errei<br><span class="text-[10px] opacity-70">agora</span></button>
      <button onclick="pontuar(3)" class="py-3.5 rounded-2xl bg-butter-100 dark:bg-ink-800 text-butter-500 font-medium text-sm">Difícil<br><span class="text-[10px] opacity-70" id="ivl3"></span></button>
      <button onclick="pontuar(4)" class="py-3.5 rounded-2xl bg-ink-100 dark:bg-ink-800 text-accent-500 font-medium text-sm">Bom<br><span class="text-[10px] opacity-70" id="ivl4"></span></button>
      <button onclick="pontuar(5)" class="py-3.5 rounded-2xl bg-sage-100 dark:bg-ink-800 text-sage-500 font-medium text-sm">Fácil<br><span class="text-[10px] opacity-70" id="ivl5"></span></button>
    </div>`;
  // mostra previsão de intervalo em cada botão
  [3, 4, 5].forEach(q => { const el = () => $('#ivl' + q); const d = previewIntervalo(cardAtual, q); if (el()) el().textContent = d + 'd'; });
}
function virarCard() {
  $('#flipCard').classList.toggle('flipped');
  const g = $('#gradeBtns');
  g.classList.remove('hidden'); g.classList.add('grid');
}
function sm2(card, q) {
  if (q < 3) { card.reps = 0; card.intervalo = 0; card.due = Date.now(); return; }
  card.ef = Math.max(1.3, card.ef + (0.1 - (5 - q) * (0.08 + (5 - q) * 0.02)));
  card.reps++;
  if (card.reps === 1) card.intervalo = 1;
  else if (card.reps === 2) card.intervalo = 6;
  else card.intervalo = Math.round(card.intervalo * card.ef);
  if (q === 3) card.intervalo = Math.max(1, Math.round(card.intervalo * 0.8)); // difícil encurta
  card.due = Date.now() + card.intervalo * 864e5;
}
function previewIntervalo(card, q) {
  const c = { ...card }; sm2(c, q); return c.intervalo;
}
function pontuar(q) {
  const eraNovo = cardAtual.reps === 0;
  sm2(cardAtual, q);
  if (q < 3) fila.push(cardAtual); // errou: volta na própria sessão
  else if (eraNovo) dailyLog().novos++; // card novo "graduou" → conta no limite diário
  save(); proximoCard();
}

}
function marcarCE(i, v, btn) {
  respostas[i] = v;
  [...btn.parentElement.children].forEach(b => b.classList.remove('bg-accent-500', 'text-white', 'border-accent-500'));
  btn.classList.add('bg-accent-500', 'text-white', 'border-accent-500');

function marcarME(letra, btn) {
  respostas.alt = letra;

}

function corrigir(qId, origem) {
  const q = db.questoes.find(x => x.id === qId);
  let erros = [], acertos = 0, total = 0;

  if (q.tipo === 'CE') {
    if (Object.keys(respostas).length < q.itens.length) { toast('Julgue todos os itens'); return; }
    q.itens.forEach((it, i) => {
      total++;
      const ok = respostas[i] === it.gabarito;
      if (ok) acertos++; else erros.push(`Item ${i + 1}`);
      db.answers.push({ materiaId: q.materiaId, topicoId: q.topicoId, correct: ok, ts: Date.now() });
      const box = $(`#item${i}`), cmt = box.querySelector('.cmt');
      box.classList.add(ok ? 'border-sage-300' : 'border-blush-300');
      cmt.classList.remove('hidden');
      cmt.className = `cmt mt-3 text-xs leading-relaxed rounded-xl p-3 ${ok ? 'bg-sage-100 dark:bg-ink-850 text-sage-500 dark:text-sage-300' : 'bg-blush-100 dark:bg-ink-850 text-blush-500 dark:text-blush-300'}`;
      cmt.innerHTML = `<b>Gabarito: ${it.gabarito === 'C' ? 'CERTO' : 'ERRADO'} ${ok ? '· você acertou ✓' : '· você errou ✗'}</b><br>${esc(it.comentario)}`;
      box.querySelectorAll('.ce-btn').forEach(b => b.disabled = true);
    });
  } else {
    if (!respostas.alt) { toast('Escolha uma alternativa'); return; }
    total = 1;
    const ok = respostas.alt === q.gabarito;
    if (ok) acertos = 1; else erros.push(`Alternativa ${respostas.alt} (correta: ${q.gabarito})`);
    db.answers.push({ materiaId: q.materiaId, topicoId: q.topicoId, correct: ok, ts: Date.now() });
    q.alternativas.forEach(a => {
      const btn = $(`.me-btn[data-letra="${a.letra}"]`), cmt = $(`.cmt-${a.letra}`);
      const isGab = a.letra === q.gabarito, marcada = a.letra === respostas.alt;
      if (isGab) btn.classList.add('border-sage-300', 'bg-sage-100', 'dark:bg-ink-850');
      else if (marcada) btn.classList.add('border-blush-300', 'bg-blush-100', 'dark:bg-ink-850');
      cmt.classList.remove('hidden');
      cmt.className = `cmt-${a.letra} mb-2.5 -mt-1 text-xs leading-relaxed rounded-xl p-3 mx-2 ${isGab ? 'bg-sage-100 dark:bg-ink-850 text-sage-500 dark:text-sage-300' : 'bg-ink-50 dark:bg-ink-900 text-ink-400'}`;
      cmt.innerHTML = `${isGab ? '<b>✓ GABARITO</b> · ' : ''}${esc(a.comentario || '')}`;
      btn.disabled = true;
    });
  }

  q.lastResult = erros.length === 0;

  // caderno de erros com repetição espaçada:
  // errou → entra/volta no SRS (revisão amanhã); acertou de novo → intervalo cresce; dominou (≥21d) → sai do caderno
  if (erros.length) registrarErro(q, erros.join(', '));
  else marcarAcertoErro(q);
  save();
  $('#btnCorrigir').style.display = 'none';
  $('#qResultado').innerHTML = `
    <div class="mt-4 rounded-2xl p-5 text-center ${erros.length ? 'bg-blush-100 dark:bg-ink-900' : 'bg-sage-100 dark:bg-ink-900'}">
      <div class="text-2xl mb-1">${erros.length ? '😬' : '🎯'}</div>
      <p class="font-medium ${erros.length ? 'text-blush-500' : 'text-sage-500'}">${acertos}/${total} acerto(s)</p>
      ${erros.length ? `<p class="text-xs text-ink-400 mt-1">Registrado no caderno de erros para refazer depois.</p>` : ''}
      ${q.comentario ? `<p class="text-xs text-ink-500 dark:text-ink-300 mt-3 text-left leading-relaxed"><b>Comentário geral:</b> ${esc(q.comentario)}</p>` : ''}
    </div>`;
}

/* ============================ 11. SRS DO CADERNO DE ERROS ============================
   Questão errada entra na repetição espaçada: volta em 1 dia; a cada acerto o
   intervalo cresce (SM-2); com intervalo ≥ 21 dias é considerada dominada e sai.
   ===================================================================================== */
function errosDue() { return db.errors.filter(e => (e.due || 0) <= Date.now()); }

function srsErro(e, ok) {
  if (ok) { sm2(e, 4); }
  else { e.reps = 0; e.ef = Math.max(1.3, (e.ef || 2.5) - 0.2); e.intervalo = 1; e.due = Date.now() + 864e5; }
}
function registrarErro(q, detalhe) {
  const ex = db.errors.find(e => e.qId === q.id);
  if (ex) { ex.detalhe = detalhe; ex.ts = Date.now(); srsErro(ex, false); }
  else db.errors.push({ id: uid(), qId: q.id, materiaId: q.materiaId, banca: q.banca, detalhe, trecho: q.trecho, ts: Date.now(), ef: 2.5, intervalo: 1, reps: 0, due: Date.now() + 864e5 });
}
function marcarAcertoErro(q) {
  const ex = db.errors.find(e => e.qId === q.id);
  if (!ex) return;
  srsErro(ex, true);
  if (ex.intervalo >= 21) {
    db.errors = db.errors.filter(e => e.id !== ex.id);
    setTimeout(() => toast('🏆 Questão dominada — saiu do caderno de erros'), 800);
  }
}

/* ============================ 12. CICLO DE ESTUDOS ============================
   Aloca as horas semanais por: peso no edital × (2 − taxa de acerto).
   Matéria com peso alto e desempenho ruim recebe mais horas.
   ============================================================================== */
function inicioSemana(ts = Date.now()) {
  const d = new Date(ts); d.setHours(0, 0, 0, 0);
  return d.getTime() - ((d.getDay() + 6) % 7) * 864e5; // segunda-feira 00:00
}
function horasEstudadasSemana() { // minutos por matéria na semana corrente
  const ws = inicioSemana(), map = {};
  db.sessions.filter(s => s.ts >= ws).forEach(s => map[s.materiaId] = (map[s.materiaId] || 0) + s.min);
  return map;
}
function metaSemanal() {
  if (!db.materias.length) return [];
  const accMap = statsPorMateria(), week = horasEstudadasSemana();
  const itens = db.materias.map(m => {
    const peso = +db.edital.pesos[m.id] || 3;
    const s = accMap[m.id];
    const acc = (s && s.total >= 5) ? s.certas / s.total : 0.5;
    return { m, peso, acc, score: peso * (2 - acc) };
  });
  const tot = itens.reduce((a, b) => a + b.score, 0) || 1;
  return itens.map(x => ({
    materiaId: x.m.id, nome: x.m.nome, peso: x.peso, acc: x.acc,
    meta: db.edital.horasSemana * x.score / tot,
    estudado: (week[x.m.id] || 0) / 60
  }));
}
function recomendacao() {
  const lst = metaSemanal();
  if (!lst.length) return null;
  return lst.map(x => ({ ...x, deficit: x.meta - x.estudado })).sort((a, b) => b.deficit - a.deficit)[0];
}
function setPeso(mId, v) { db.edital.pesos[mId] = +v; save(); renderCiclo(); }

        <input type="number" min="1" max="80" value="${db.edital.horasSemana}" onchange="db.edital.horasSemana=Math.max(1,+this.value||20);save();renderCiclo()" class="w-20 px-3 py-2 rounded-xl border border-ink-200 dark:border-ink-700 bg-transparent text-sm">

        <input type="date" value="${esc(db.edital.dataProva)}" onchange="db.edital.dataProva=this.value;save();renderCiclo()" class="px-3 py-2 rounded-xl border border-ink-200 dark:border-ink-700 bg-transparent text-sm">
      </label>
      ${rec && rec.deficit > 0.05 ? `<button onclick="modalTimer('${rec.materiaId}')" class="ml-auto px-4 py-2.5 rounded-xl bg-accent-500 text-white text-sm font-medium">▶ Estudar agora: ${esc(rec.nome)}</button>` : ''}
    </div>

const TIMER_KEY = 'aprovaplus_timer';
let timerInt = null;

function timerState() { try { return JSON.parse(localStorage.getItem(TIMER_KEY)); } catch (e) { return null; } }
function setTimerState(s) { s ? localStorage.setItem(TIMER_KEY, JSON.stringify(s)) : localStorage.removeItem(TIMER_KEY); }
function logSessao(materiaId, min) { if (min >= 1) { db.sessions.push({ materiaId, min, ts: Date.now() }); save(); } }
function beep() {
  try {
    const a = new (window.AudioContext || window.webkitAudioContext)();
    const o = a.createOscillator(), g = a.createGain();
    o.connect(g); g.connect(a.destination);
    o.frequency.value = 880; g.gain.value = .12;
    o.start(); o.stop(a.currentTime + .35);
  } catch (e) {}
}
function modalTimer(preMat) {
  if (!db.materias.length) { toast('Crie uma matéria primeiro'); return; }
  if (timerState()) { toast('Já existe uma sessão em andamento'); return; }
  openModal(`
    <h3 class="font-semibold text-lg mb-4 flex items-center gap-2"><i data-lucide="alarm-clock" class="w-5 h-5 text-accent-500"></i>Iniciar sessão de estudo</h3>
    <label class="text-xs font-medium text-ink-400 block mb-1">Matéria</label>
    <select id="tmMat" class="w-full px-3 py-2.5 rounded-xl border border-ink-200 dark:border-ink-700 bg-white dark:bg-ink-900 text-sm mb-3">
      ${db.materias.map(m => `<option value="${m.id}" ${preMat === m.id ? 'selected' : ''}>${esc(m.nome)}</option>`).join('')}
    </select>
    <label class="text-xs font-medium text-ink-400 block mb-1">Modo</label>
    <select id="tmModo" class="w-full px-3 py-2.5 rounded-xl border border-ink-200 dark:border-ink-700 bg-white dark:bg-ink-900 text-sm mb-4">
      <option value="pomo">🍅 Pomodoro (${db.settings.foco} min foco / ${db.settings.pausa} min pausa)</option>
      <option value="livre">⏱ Cronômetro livre</option>
    </select>
    <div class="flex justify-end gap-2">
      <button onclick="closeModal()" class="px-4 py-2.5 rounded-xl text-sm text-ink-400">Cancelar</button>
      <button onclick="iniciarTimer()" class="px-4 py-2.5 rounded-xl bg-accent-500 text-white text-sm font-medium">▶ Começar</button>
    </div>`);
}
function iniciarTimer() {
  setTimerState({ materiaId: $('#tmMat').value, modo: $('#tmModo').value, fase: 'foco', start: Date.now(), paused: false, pauseStart: 0 });
  closeModal();
  $('#timerWidget').classList.remove('hidden');
  clearInterval(timerInt); timerInt = setInterval(tickTimer, 1000); tickTimer();
}
function retomarTimer() {
  if (!timerState()) return;
  $('#timerWidget').classList.remove('hidden');
  clearInterval(timerInt); timerInt = setInterval(tickTimer, 1000); tickTimer();
}
function tickTimer() {
  const st = timerState();
  if (!st) { clearInterval(timerInt); $('#timerWidget').classList.add('hidden'); return; }
  const now = Date.now();
  const elapsed = (st.paused ? st.pauseStart : now) - st.start;
  const limite = st.modo === 'pomo' ? (st.fase === 'foco' ? db.settings.foco : db.settings.pausa) * 60000 : Infinity;
  if (!st.paused && elapsed >= limite) {
    if (st.fase === 'foco') { logSessao(st.materiaId, Math.round(limite / 60000)); st.fase = 'pausa'; toast('☕ Pausa! ' + db.settings.pausa + ' min'); }
    else { st.fase = 'foco'; toast('🎯 Foco! ' + db.settings.foco + ' min'); }
    beep(); st.start = now; setTimerState(st);
  }
  const e2 = st.paused ? st.pauseStart - st.start : now - st.start;
  const mostrar = st.modo === 'pomo' ? Math.max(0, limite - e2) : e2;
  $('#twTime').textContent = String(Math.floor(mostrar / 60000)).padStart(2, '0') + ':' + String(Math.floor(mostrar % 60000 / 1000)).padStart(2, '0');
  $('#twInfo').textContent = (st.modo === 'pomo' ? (st.fase === 'foco' ? '🎯 ' : '☕ ') : '⏱ ') + (materiaById(st.materiaId)?.nome || '');
  $('#twPause').textContent = st.paused ? '▶' : '⏸';
}
function pausarTimer() {
  const st = timerState(); if (!st) return;
  if (st.paused) { st.start += Date.now() - st.pauseStart; st.paused = false; }
  else { st.paused = true; st.pauseStart = Date.now(); }
  setTimerState(st); tickTimer();
}
function pararTimer() {
  const st = timerState(); if (!st) return;
  if (st.fase === 'foco') {
    const fim = st.paused ? st.pauseStart : Date.now();
    logSessao(st.materiaId, Math.round((fim - st.start) / 60000));
  }
  setTimerState(null); clearInterval(timerInt);
  $('#timerWidget').classList.add('hidden');
  toast('Sessão registrada ✓');
  if (currentView === 'dashboard') renderDashboard();
  if (currentView === 'ciclo') renderCiclo();
}

/* ============================ 14. GRÁFICOS DO PAINEL ============================ */
function svgAcuracia() {
  const weeks = [];
  for (let i = 7; i >= 0; i--) {
    const start = inicioSemana(Date.now() - i * 7 * 864e5), end = start + 7 * 864e5;
    const as = db.answers.filter(a => a.ts >= start && a.ts < end);
    weeks.push({
      label: new Date(start).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }),
      pct: as.length ? Math.round(as.filter(a => a.correct).length / as.length * 100) : null
    });
  }
  if (!weeks.some(w => w.pct !== null)) return '<p class="text-sm text-ink-400">Responda questões para ver sua evolução semanal.</p>';
  const X = i => (i / (weeks.length - 1)) * 290 + 18, Y = p => 92 - p * 0.8;
  const pts = weeks.map((w, i) => w.pct === null ? null : `${X(i)},${Y(w.pct)}`).filter(Boolean).join(' ');
  return `<svg viewBox="0 0 320 112" class="w-full">
    ${[0, 50, 100].map(v => `<line x1="14" x2="312" y1="${Y(v)}" y2="${Y(v)}" stroke="currentColor" opacity=".08"/><text x="0" y="${Y(v) + 3}" font-size="8" fill="currentColor" opacity=".4">${v}</text>`).join('')}
    <polyline points="${pts}" fill="none" stroke="#6c6cbb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${weeks.map((w, i) => w.pct === null ? '' : `<circle cx="${X(i)}" cy="${Y(w.pct)}" r="3.5" fill="#6c6cbb"/><text x="${X(i)}" y="108" font-size="7" text-anchor="middle" fill="currentColor" opacity=".5">${w.label}</text>`).join('')}
  </svg>`;
}
function heatmapHTML() {
  const mins = {};
  db.sessions.forEach(s => { const k = new Date(s.ts).toDateString(); mins[k] = (mins[k] || 0) + s.min; });
  db.answers.forEach(a => { const k = new Date(a.ts).toDateString(); mins[k] = (mins[k] || 0) + 2; });
  const start = inicioSemana(Date.now() - 11 * 7 * 864e5);
  let html = '<div class="flex gap-1">';
  for (let w = 0; w < 12; w++) {
    html += '<div class="flex flex-col gap-1">';
    for (let d = 0; d < 7; d++) {
      const t = start + (w * 7 + d) * 864e5;
      if (t > Date.now()) { html += '<div class="w-3.5 h-3.5"></div>'; continue; }
      const m = mins[new Date(t).toDateString()] || 0;
      const cls = m === 0 ? 'bg-ink-100 dark:bg-ink-800' : m < 15 ? 'bg-accent-200 dark:bg-accent-600/40' : m < 30 ? 'bg-accent-300 dark:bg-accent-500/60' : m < 60 ? 'bg-accent-400' : 'bg-accent-500';
      html += `<div class="w-3.5 h-3.5 rounded-[3px] ${cls}" title="${new Date(t).toLocaleDateString('pt-BR')} · ${m} min"></div>`;
    }
    html += '</div>';
  }
  return html + '</div>';
}
function topicosFracos() {
  const map = {};
  db.answers.forEach(a => {
    if (!a.topicoId) return;
    const k = a.materiaId + '|' + a.topicoId;
    map[k] = map[k] || { t: 0, c: 0 };
    map[k].t++; if (a.correct) map[k].c++;
  });
  return Object.entries(map)
    .filter(([, v]) => v.t >= 5)
    .map(([k, v]) => {
      const [mId, tId] = k.split('|');
      return { nome: `${materiaById(mId)?.nome || '?'} · ${topicoNome(mId, tId) || '?'}`, pct: Math.round(v.c / v.t * 100), n: v.t };
    })
    .sort((a, b) => a.pct - b.pct).slice(0, 5);
}

TAREFA: estruture TODAS as questões encontradas. Para cada uma, detecte o formato:
- Certo/Errado (Cebraspe): tipo "CE"
- Múltipla escolha: tipo "ME"

REGRAS:
1. Preserve fielmente enunciado, itens e alternativas.
2. Se o gabarito constar no texto, use-o. Se NÃO constar, resolva você mesmo com máximo rigor e adicione "gabaritoIA": true.
3. Se não houver comentário no texto, escreva um comentário explicativo curto e didático para cada item/alternativa.
4. Identifique a banca se mencionada (campo "banca"); senão use "Importada".

Responda APENAS com JSON válido (array), sem texto adicional:
[
 {"tipo":"CE","banca":"...","contexto":"","itens":[{"texto":"...","gabarito":"C","comentario":"..."}],"gabaritoIA":false},
 {"tipo":"ME","banca":"...","enunciado":"...","alternativas":[{"letra":"A","texto":"...","comentario":"..."}],"gabarito":"B","comentario":"...","gabaritoIA":false}
]

TEXTO BRUTO:
"""
${raw}
"""`;
}

/* cria/mescla matérias, tópicos e pesos (não duplica o que já existe) */
function criarEstrutura(materias) {
  let nM = 0, nT = 0;
  materias.forEach(x => {
    let m = db.materias.find(mm => mm.nome.toLowerCase() === String(x.nome).toLowerCase());
    if (!m) { m = { id: uid(), nome: String(x.nome), topicos: [] }; db.materias.push(m); nM++; }
    (x.topicos || []).forEach(tn => {
      if (!m.topicos.some(t => t.nome.toLowerCase() === String(tn).toLowerCase())) {
        m.topicos.push({ id: uid(), nome: String(tn) }); nT++;
      }
    });
    if (x.peso) db.edital.pesos[m.id] = Math.min(5, Math.max(1, +x.peso || 3));
  });
  save();
  return { nM, nT };
}

function iniciarSimulado() {
  const mats = $$('.simMat:checked').map(c => c.value);
  let pool = db.questoes.filter(q => mats.includes(q.materiaId));
  if (!pool.length) { toast('Nenhuma questão nas matérias escolhidas'); return; }
  const n = Math.min(+$('#simN').value, pool.length);
  pool = pool.sort(() => Math.random() - .5).slice(0, n);
  const min = +$('#simMin').value;
  sim = { qs: pool, idx: 0, resp: {}, durMin: min, end: Date.now() + min * 60000, startTs: Date.now() };
  closeModal();
  clearInterval(simInt);
  simInt = setInterval(() => {
    if (!sim) { clearInterval(simInt); return; }
    if (Date.now() >= sim.end) { toast('⏰ Tempo esgotado!'); finalizarSimulado(); }
    else {
      const el = $('#simClock');
      if (el) {
        const r = sim.end - Date.now();
        el.textContent = String(Math.floor(r / 60000)).padStart(2, '0') + ':' + String(Math.floor(r % 60000 / 1000)).padStart(2, '0');
        if (r < 60000) el.classList.add('text-blush-500');
      }
    }
  }, 1000);
  renderSimQ();
}
function renderSimQ() {
  const q = sim.qs[sim.idx], r = sim.resp[sim.idx] || {};

  if (q.tipo === 'CE') {
    corpo = `${q.contexto ? `<p class="text-sm leading-relaxed mb-4 bg-ink-50 dark:bg-ink-900 rounded-xl p-4">${esc(q.contexto)}</p>` : ''}
      ${q.itens.map((it, i) => `

          <div class="flex gap-2">
            <button onclick="simCE(${i},'C')" class="flex-1 py-2.5 rounded-xl border text-sm font-medium ${r[i] === 'C' ? selCls : 'border-ink-200 dark:border-ink-700'}">✓ Certo</button>
            <button onclick="simCE(${i},'E')" class="flex-1 py-2.5 rounded-xl border text-sm font-medium ${r[i] === 'E' ? selCls : 'border-ink-200 dark:border-ink-700'}">✗ Errado</button>

          <span class="font-semibold shrink-0">${a.letra})</span><span class="flex-1">${esc(a.texto)}</span>
        </button>`).join('')}`;
  }
  $('#view-simulados').innerHTML = `
    <div class="flex items-center justify-between mb-2">
      <span class="text-sm font-medium">Questão ${sim.idx + 1}/${sim.qs.length} <span class="text-xs text-ink-400">· ${esc(q.banca)} · ${esc(materiaById(q.materiaId)?.nome || '')}</span></span>
      <span id="simClock" class="text-lg font-semibold tabular-nums">--:--</span>
    </div>
    <div class="h-1.5 rounded-full bg-ink-100 dark:bg-ink-800 mb-5"><div class="h-full rounded-full bg-accent-400" style="width:${((sim.idx + 1) / sim.qs.length) * 100}%"></div></div>

    <div class="flex gap-2 mt-4">

        ? `<button onclick="simNav(1)" class="flex-1 py-3 rounded-2xl bg-accent-500 text-white text-sm font-medium">Próxima →</button>`
        : `<button onclick="finalizarSimulado()" class="flex-1 py-3 rounded-2xl bg-sage-500 text-white text-sm font-medium">✓ Finalizar simulado</button>`}
      ${sim.idx < sim.qs.length - 1 ? `<button onclick="if(confirm('Finalizar agora? Questões em branco contam como erro.'))finalizarSimulado()" class="px-4 py-3 rounded-2xl border border-ink-200 dark:border-ink-700 text-xs text-ink-400">Finalizar</button>` : ''}
    </div>`;
}
function simCE(i, v) { (sim.resp[sim.idx] = sim.resp[sim.idx] || {})[i] = v; renderSimQ(); }
function simME(l) { sim.resp[sim.idx] = { alt: l }; renderSimQ(); }
function simNav(d) { sim.idx = Math.max(0, Math.min(sim.qs.length - 1, sim.idx + d)); renderSimQ(); }

function finalizarSimulado() {
  clearInterval(simInt);
  if (!sim) return;
  let total = 0, acertos = 0;
  const porMat = {}, detalhes = [];
  sim.qs.forEach((q, qi) => {
    const r = sim.resp[qi] || {}, errosQ = [];
    const reg = ok => {
      total++; if (ok) acertos++;
      porMat[q.materiaId] = porMat[q.materiaId] || { t: 0, c: 0 };
      porMat[q.materiaId].t++; if (ok) porMat[q.materiaId].c++;
      db.answers.push({ materiaId: q.materiaId, topicoId: q.topicoId, correct: ok, ts: Date.now() });
    };
    if (q.tipo === 'CE') q.itens.forEach((it, i) => { const ok = r[i] === it.gabarito; reg(ok); if (!ok) errosQ.push('Item ' + (i + 1)); });
    else { const ok = r.alt === q.gabarito; reg(ok); if (!ok) errosQ.push('Alternativa ' + (r.alt || 'em branco') + ' (correta: ' + q.gabarito + ')'); }
    q.lastResult = errosQ.length === 0;
    if (errosQ.length) registrarErro(q, '[simulado] ' + errosQ.join(', '));
    else marcarAcertoErro(q);
    detalhes.push({ q, ok: errosQ.length === 0 });
  });
  const tempoMin = Math.max(1, Math.round((Date.now() - sim.startTs) / 60000));
  db.simulados.push({ id: uid(), ts: Date.now(), total, acertos, tempoMin, n: sim.qs.length });
  // ritmo médio por banca (aproximação: tempo do simulado distribuído pelas questões)
  sim.qs.forEach(q => {
    const bs = db.bancaStats[q.banca] = db.bancaStats[q.banca] || { min: 0, q: 0 };
    bs.min += tempoMin / sim.qs.length; bs.q++;
  });
  save();
  const pct = total ? Math.round(acertos / total * 100) : 0;
  $('#view-simulados').innerHTML = `
    <div class="text-center py-6">
      <div class="text-5xl mb-2">${pct >= 70 ? '🏆' : pct >= 50 ? '💪' : '📚'}</div>
      <div class="text-4xl font-semibold ${pct >= 70 ? 'text-sage-500' : pct >= 50 ? 'text-butter-500' : 'text-blush-500'}">${pct}%</div>
      <p class="text-ink-400 text-sm mt-1">${acertos}/${total} itens · ${tempoMin} min ${tempoMin > 0 ? '· ' + (tempoMin / sim.qs.length).toFixed(1) + ' min/questão' : ''}</p>
    </div>
    <h2 class="font-semibold mb-3 text-sm">Por matéria</h2>
    <div class="bg-white dark:bg-ink-900 border border-ink-100 dark:border-ink-800 rounded-2xl p-4 mb-5">

/* ============================ 17. LEI SECA (parser estrutural) ============================ */
function leiParaHTML(txt) {
  const lines = txt.split(/\n+/).map(l => l.trim()).filter(Boolean);
  let html = '', artOpen = false;
  const fechar = () => { if (artOpen) { html += '</div>'; artOpen = false; } };
  for (const l of lines) {
    const art = l.match(/^(Art(?:igo)?\.?\s*\d+[ºo°]?(?:-[A-Z])?\.?)/i);
    if (art) {
      fechar(); artOpen = true;
      html += `<div class="lei-art"><p class="lei-caput"><button class="art-gen" title="Gerar flashcards deste artigo">⚡</button><span class="art-num">${esc(art[1])}</span> ${esc(l.slice(art[1].length).trim())}</p>`;
    }
    else if (/^(§\s*\d+|Parágrafo único)/i.test(l)) html += `<p class="lei-par">${esc(l)}</p>`;
    else if (/^[IVXLCDM]+\s*[–\-—.)]/.test(l)) html += `<p class="lei-inc">${esc(l)}</p>`;
    else if (/^[a-z]\)/.test(l)) html += `<p class="lei-ali">${esc(l)}</p>`;
    else if (/^(T[ÍI]TULO|CAP[ÍI]TULO|SE[ÇC][ÃA]O|SUBSE[ÇC][ÃA]O|LIVRO|PARTE|DISPOSI[ÇC]) /i.test(l) || /^(T[ÍI]TULO|CAP[ÍI]TULO)/i.test(l)) { fechar(); html += `<p class="lei-head">${esc(l)}</p>`; }
    else html += artOpen ? `<p class="lei-txt">${esc(l)}</p>` : `<p>${esc(l)}</p>`;
  }
  fechar();
  return html;
}

function mdInline(s) {
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/\*(.+?)\*/g, '<i>$1</i>')
    .replace(/`(.+?)`/g, '<code class="text-accent-500">$1</code>');
}
function mdToHTML(md) {
  let html = '', depth = 0;
  const fechar = n => { while (depth > n) { html += '</ul>'; depth--; } };
  md.split('\n').forEach(l => {
    const h = l.match(/^(#{1,5})\s+(.*)/);
    const li = l.match(/^(\s*)[-*]\s+(.*)/);
    if (h) { fechar(0); html += `<h${Math.min(h[1].length + 1, 5)}>${mdInline(h[2])}</h${Math.min(h[1].length + 1, 5)}>`; }
    else if (li) {
      const lvl = Math.floor(li[1].length / 2) + 1;
      while (depth < lvl) { html += '<ul>'; depth++; }
      fechar(lvl);
      html += `<li>${mdInline(li[2])}</li>`;
    }
    else if (l.trim()) { fechar(0); html += `<p>${mdInline(l)}</p>`; }
  });
  fechar(0);
  return `<div class="md-body text-sm leading-relaxed">${html}</div>`;
}

/* ============================ 19. COBERTURA DO EDITAL E STREAK ============================ */
function cobertura() {
  let tot = 0, ok = 0; const buracos = [];
  db.materias.forEach(m => m.topicos.forEach(t => {
    tot++;
    const temTexto = db.texts.some(x => x.topicoId === t.id);
    const temCard = db.cards.some(x => x.topicoId === t.id);
    const temQ = db.questoes.some(x => x.topicoId === t.id);
    if (temTexto && temCard && temQ) ok++;
    else buracos.push({ materia: m.nome, topico: t.nome, temTexto, temCard, temQ });
  }));
  return { tot, ok, pct: tot ? Math.round(ok / tot * 100) : 0, buracos };
}
function streak() {
  const dias = new Set();
  db.sessions.forEach(x => dias.add(new Date(x.ts).toDateString()));
  db.answers.forEach(x => dias.add(new Date(x.ts).toDateString()));
  let n = 0, d = new Date(); d.setHours(0, 0, 0, 0);
  if (!dias.has(d.toDateString())) d = new Date(d.getTime() - 864e5); // hoje ainda não estudou: conta a partir de ontem
  while (dias.has(d.toDateString())) { n++; d = new Date(d.getTime() - 864e5); }
  return n;
}

      <h3 class="font-semibold text-sm mb-2">🚀 Prioridades para a próxima</h3>
      <div class="bg-accent-100/50 dark:bg-ink-900 border border-accent-200 dark:border-ink-800 rounded-2xl p-4 text-sm">
        ${c.melhorias.map((m, i) => `<p class="mb-1.5">${i + 1}. ${esc(m)}</p>`).join('')}
      </div>` : ''}
  </div>`;
}

/* ============================ 21. BUSCA GLOBAL ============================ */
function stripHTML(h) { const d = document.createElement('div'); d.innerHTML = h; return d.innerText; }
function trechoBusca(texto, q) {
  const i = texto.toLowerCase().indexOf(q);
  if (i < 0) return '';
  const ini = Math.max(0, i - 50);
  return (ini > 0 ? '…' : '') + esc(texto.slice(ini, i)) + '<mark class="bg-butter-300/60 rounded px-0.5">' + esc(texto.slice(i, i + q.length)) + '</mark>' + esc(texto.slice(i + q.length, i + q.length + 70)) + '…';
}
function modalBusca() {
  openModal(`
    <div class="flex items-center gap-2 mb-4">
      <i data-lucide="search" class="w-5 h-5 text-ink-400"></i>
      <input id="buscaInp" oninput="clearTimeout(window._bt);window._bt=setTimeout(executarBusca,250)" placeholder="Buscar em textos, cards, questões e resumos…" class="flex-1 px-3 py-2.5 rounded-xl border border-ink-200 dark:border-ink-700 bg-transparent text-sm">
    </div>
    <div id="buscaRes" class="max-h-[55dvh] overflow-y-auto"><p class="text-xs text-ink-300 dark:text-ink-500 text-center py-6">Digite ao menos 3 letras. Dica: a tecla "/" abre esta busca.</p></div>`);
  $('#buscaInp').focus();
}
function executarBusca() {
  const q = $('#buscaInp').value.trim().toLowerCase();
  const out = $('#buscaRes');
  if (q.length < 3) { out.innerHTML = '<p class="text-xs text-ink-300 dark:text-ink-500 text-center py-6">Digite ao menos 3 letras.</p>'; return; }
  let html = '';
  const grupo = (titulo, itens) => itens.length ? `<p class="text-[11px] font-semibold text-ink-400 uppercase tracking-wide mt-3 mb-1.5">${titulo} (${itens.length})</p>` + itens.slice(0, 8).join('') : '';

  const txts = db.texts.map(t => {
    const plain = t.titulo + ' ' + stripHTML(t.html);
    if (!plain.toLowerCase().includes(q)) return null;
    return `<button onclick="closeModal();openReader('${t.id}')" class="w-full text-left p-3 rounded-xl hover:bg-ink-50 dark:hover:bg-ink-850 text-sm">
      <div class="font-medium">${t.kind === 'lei' ? '⚖️' : '📄'} ${esc(t.titulo)}</div>
      <div class="text-xs text-ink-400 mt-0.5">${trechoBusca(plain, q)}</div></button>`;
  }).filter(Boolean);

  const cds = db.cards.map(c => {
    const plain = c.front + ' ' + c.back;
    if (!plain.toLowerCase().includes(q)) return null;
    return `<div class="p-3 rounded-xl bg-ink-50 dark:bg-ink-850 text-sm mb-1.5">
      <div class="font-medium">🗂 ${esc(c.front)}</div>
      <div class="text-xs text-ink-400 mt-0.5">${esc(c.back)} · ${esc(materiaById(c.materiaId)?.nome || '')}</div></div>`;
  }).filter(Boolean);

  const qsts = db.questoes.map(qx => {
    const plain = (qx.enunciado || qx.contexto || '') + ' ' + (qx.itens || []).map(i => i.texto).join(' ') + ' ' + (qx.alternativas || []).map(a => a.texto).join(' ');
    if (!plain.toLowerCase().includes(q)) return null;
    return `<button onclick="closeModal();showView('questoes');abrirQuestao('${qx.id}')" class="w-full text-left p-3 rounded-xl hover:bg-ink-50 dark:hover:bg-ink-850 text-sm">
      <div class="font-medium">📝 ${esc(qx.banca)} · ${esc(materiaById(qx.materiaId)?.nome || '')}</div>
      <div class="text-xs text-ink-400 mt-0.5">${trechoBusca(plain, q)}</div></button>`;
  }).filter(Boolean);

  const rsm = db.resumos.map(r => {
    if (!r.md.toLowerCase().includes(q)) return null;
    return `<button onclick="verResumo('${r.id}')" class="w-full text-left p-3 rounded-xl hover:bg-ink-50 dark:hover:bg-ink-850 text-sm">
      <div class="font-medium">${TIPO_RESUMO[r.tipo] || r.tipo}</div>
      <div class="text-xs text-ink-400 mt-0.5">${trechoBusca(r.md, q)}</div></button>`;
  }).filter(Boolean);

  html = grupo('Textos e leis', txts) + grupo('Flashcards', cds) + grupo('Questões', qsts) + grupo('Resumos', rsm);
  out.innerHTML = html || '<p class="text-xs text-ink-300 dark:text-ink-500 text-center py-6">Nada encontrado.</p>';
}

/* ============================ 22. EXPORTAÇÃO PARA O ANKI ============================ */
function exportarAnki() {
  if (!db.cards.length) { toast('Nenhum flashcard para exportar'); return; }
  const tsv = db.cards.map(c => {
    const tag = ((materiaById(c.materiaId)?.nome || 'geral') + (c.topicoId ? '::' + topicoNome(c.materiaId, c.topicoId) : '')).replace(/\s+/g, '_');
    const limpa = s => String(s || '').replace(/\t/g, ' ').replace(/\n/g, '<br>');
    return [limpa(c.front), limpa(c.back), tag].join('\t');
  }).join('\n');
  const blob = new Blob(['﻿' + tsv], { type: 'text/tab-separated-values;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'aprovaplus-anki.txt';
  a.click();
  toast(`${db.cards.length} cards exportados — no Anki: Arquivo → Importar (campo 3 = tags)`);
}

/* ============================ 23. BACKUP AUTOMÁTICO ============================ */
function checarBackup() {
  const s = db.settings;
  if (!s.autoBackup) return;
  if (!(db.texts.length || db.cards.length || db.questoes.length)) return;
  if (Date.now() - (s.lastBackup || 0) > 7 * 864e5) {
    exportarDados();
    s.lastBackup = Date.now(); save();
    setTimeout(() => toast('💾 Backup automático baixado — guarde no iCloud Drive', 4000), 1200);
  }
}

/* ============================ 20. INICIALIZAÇÃO ============================ */
// salva grifos pendentes ao sair / trocar de aba
window.addEventListener('beforeunload', () => { if (currentView === 'leitor') saveReaderHTML(); });
window.addEventListener('resize', () => { if (currentView === 'leitor') resizeCanvasKeep(); });

// substitui a view 'erros' do roteador padrão (usa render próprio)
const _origShow = showView;
showView = function (id) {
  if (currentView === 'leitor') saveReaderHTML();
  if (id === 'erros') { renderErros(); return; }
  _origShow(id);
};

(async function boot() {
  db = await loadDB();
  flushSave();                                   // garante cópia no IndexedDB (inclui migração do LocalStorage)
  if (navigator.storage?.persist) navigator.storage.persist().catch(() => {});  // pede armazenamento persistente ao navegador
  applyTheme();
  renderNav();
  showView('dashboard');
  lucide.createIcons();
  retomarTimer();      // restaura cronômetro em andamento (sobrevive a recarregar a página)
  checarBackup();      // backup automático semanal

  // PWA: service worker (funciona quando o app é servido via http/https)
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }
})();

// atalho de busca global: tecla "/"
document.addEventListener('keydown', e => {
  if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || '')) {
    e.preventDefault(); modalBusca();
  }
});
</script>
